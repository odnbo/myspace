<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诗意时光</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 3rem;
            position: relative;
            z-index: 2;
            backdrop-filter: blur(10px);
            animation: fadeIn 1.5s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            padding-bottom: 1.5rem;
        }
        
        h1 {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 0.5rem;
            font-weight: 300;
            letter-spacing: 2px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #7f8c8d;
            font-style: italic;
        }
        
        .poem-content {
            font-size: 1.2rem;
            text-align: center;
            line-height: 1.8;
        }
        
        .stanza {
            margin-bottom: 2rem;
            opacity: 0;
            animation: fadeInStanza 1s forwards;
        }
        
        .stanza:nth-child(1) { animation-delay: 0.5s; }
        .stanza:nth-child(2) { animation-delay: 1.2s; }
        .stanza:nth-child(3) { animation-delay: 1.9s; }
        .stanza:nth-child(4) { animation-delay: 2.6s; }
        
        @keyframes fadeInStanza {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .line {
            margin: 0.8rem 0;
            transition: all 0.3s ease;
        }
        
        .line:hover {
            color: #3498db;
            transform: translateX(5px);
            cursor: default;
        }
        
        .footer {
            text-align: center;
            margin-top: 3rem;
            font-size: 0.9rem;
            color: #7f8c8d;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            padding-top: 1.5rem;
        }
        
        .decoration {
            position: absolute;
            font-size: 5rem;
            color: rgba(52, 152, 219, 0.1);
            z-index: 1;
        }
        
        .decoration:nth-child(1) {
            top: 10%;
            left: 5%;
        }
        
        .decoration:nth-child(2) {
            bottom: 10%;
            right: 5%;
        }
        
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.7);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            z-index: 10;
        }
        
        .theme-toggle:hover {
            transform: scale(1.1);
        }
        
        .dark-mode {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: #ecf0f1;
        }
        
        .dark-mode .container {
            background: rgba(44, 62, 80, 0.85);
            color: #ecf0f1;
        }
        
        .dark-mode .header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .dark-mode .footer {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .dark-mode .line:hover {
            color: #3498db;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 2rem 1.5rem;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .poem-content {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle">??</button>
    
    <div class="decoration">?</div>
    <div class="decoration">?</div>
    
    <div class="container">
        <div class="header">
            <h1>时光的诗</h1>
            <div class="subtitle">在流动的岁月中寻找永恒</div>
        </div>
        
        <div class="poem-content">
            <div class="stanza">
                <div class="line">时光如细沙，从指缝间溜走</div>
                <div class="line">无声无息，却留下深深痕迹</div>
                <div class="line">在记忆的河流中，泛起涟漪</div>
                <div class="line">每一道波纹，都是生命的印记</div>
            </div>
            
            <div class="stanza">
                <div class="line">晨曦微露，露珠晶莹如泪</div>
                <div class="line">暮色四合，星光悄然点亮</div>
                <div class="line">四季更迭，花开花落无声</div>
                <div class="line">唯有心中那份执着，永不凋零</div>
            </div>
            
            <div class="stanza">
                <div class="line">风起时，树叶轻轻摇曳</div>
                <div class="line">雨落时，大地静静呼吸</div>
                <div class="line">在喧嚣与寂静之间</div>
                <div class="line">我听见时光低语的声音</div>
            </div>
            
            <div class="stanza">
                <div class="line">愿以此刻为笔，以心为纸</div>
                <div class="line">记录这稍纵即逝的美好</div>
                <div class="line">在时光的长河中</div>
                <div class="line">留下属于我们的诗篇</div>
            </div>
        </div>
        
        <div class="footer">
            <p>—— 献给所有珍惜时光的人</p>
        </div>
    </div>

    <script>
        // 主题切换功能
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            themeToggle.textContent = document.body.classList.contains('dark-mode') ? '??' : '??';
        });
        
        // 为每一行诗添加点击效果
        const lines = document.querySelectorAll('.line');
        lines.forEach(line => {
            line.addEventListener('click', () => {
                line.style.transform = 'scale(1.05)';
                line.style.color = '#e74c3c';
                setTimeout(() => {
                    line.style.transform = '';
                    line.style.color = '';
                }, 1000);
            });
        });
    </script>
</body>
</html>
